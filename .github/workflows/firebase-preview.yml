# Live preview URL for every pull request.
#
# GitHub Pages serves one site per repo, so a branch cannot be looked at until
# it is on main — which is how a change reached main before anyone had seen it
# running. Firebase Hosting preview channels give each PR its own temporary URL
# instead, the way Vercel previews work.
#
# Inert until two things exist:
#   1. a Firebase project, with its id in `projectId` below and in .firebaserc
#   2. a FIREBASE_SERVICE_ACCOUNT repository secret
# Without the secret the deploy step is skipped rather than failing, so this
# file is safe to merge before the project is set up.
name: Firebase preview

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: firebase-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    # Secrets are not exposed to pull requests from forks; there is nothing to
    # deploy with, so skip rather than fail.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Check the Firebase variables
        # Each variable must hold one bare value, not the snippet the Firebase
        # console prints. Pasting the whole const firebaseConfig = {...} block
        # into VITE_FIREBASE_API_KEY built an app whose "key" was that text, and
        # every sign-in failed with auth/invalid-api-key while the deploy itself
        # reported success. Stop here with a readable reason instead.
        env:
          API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
        run: |
          if [ -z "$API_KEY$PROJECT_ID$APP_ID" ]; then
            echo "No Firebase variables set: building the offline app."
            exit 0
          fi
          fail=0
          if ! [[ "$API_KEY" =~ ^AIza[0-9A-Za-z_-]{35}$ ]]; then
            echo "::error title=VITE_FIREBASE_API_KEY::Must hold only the key (39 characters starting AIza), not the whole firebaseConfig snippet."
            fail=1
          fi
          if ! [[ "$PROJECT_ID" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]$ ]]; then
            echo "::error title=VITE_FIREBASE_PROJECT_ID::Must hold only the project id, e.g. manholes-mappers-new."
            fail=1
          fi
          if ! [[ "$APP_ID" =~ ^1:[0-9]+:web:[0-9a-f]+$ ]]; then
            echo "::error title=VITE_FIREBASE_APP_ID::Must hold only the app id, shaped like 1:1234567890:web:abc123."
            fail=1
          fi
          exit $fail

      - name: Build
        # The Firebase web config is not secret — every browser that opens the
        # app receives it — so it lives in repository *variables*, not secrets.
        # It has to be supplied here because .env.local never leaves the
        # developer's machine: without these the build is the offline app, with
        # no sign-in and none of the cloud features the preview exists to show.
        # Unset variables arrive as empty strings, which is exactly that
        # dormant build, so nothing breaks before they are added.
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
        run: npm run build

      - name: Check the service account is configured
        id: guard
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "### Firebase preview skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "No FIREBASE_SERVICE_ACCOUNT secret is set yet, so there is nowhere to deploy." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to a preview channel
        id: deploy
        if: steps.guard.outputs.ready == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: manholes-mappers-new
          expires: 7d

      # This org pins workflow tokens to read-only, which can stop the action
      # from posting its PR comment. The URL is written to the run summary too,
      # so it is still reachable when the comment does not appear.
      - name: Put the preview URL in the run summary
        if: steps.deploy.outputs.details_url != ''
        run: |
          echo "### Preview for this PR" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.deploy.outputs.details_url }}" >> "$GITHUB_STEP_SUMMARY"
